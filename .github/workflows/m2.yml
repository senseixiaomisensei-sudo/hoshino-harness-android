name: M2 signed APK delivery
on:
  push:
    branches: [codex/m2, 'hoshino/self-update-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable source downloads without Range support
        run: python3 tools/test-runtime-download.py
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: node-host/package-lock.json }
      - name: Compile and test the original dsh composition
        working-directory: node-host
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm test
      - uses: actions/upload-artifact@v4
        with: { name: m2-host, path: node-host/dist }
  proot-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 rootfs/build-proot.py
      - uses: actions/upload-artifact@v4
        with:
          name: m2-android-proot
          path: |
            app/src/main/jniLibs
            app/src/main/assets/licenses
  runtime:
    needs: host
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: actions/download-artifact@v4
        with: { name: m2-host, path: node-host/dist }
      - uses: actions/cache/restore@v4
        id: runtime
        with:
          path: |
            app/src/main/assets/kernel/${{ matrix.abi }}.txz
            .research/runtime/${{ matrix.abi }}.tgz
            docs/m1-size-${{ matrix.abi }}.json
          key: m1-kernel-v2-${{ runner.os }}-${{ matrix.abi }}-${{ hashFiles('rootfs/Dockerfile', 'rootfs/pack.py', 'rootfs/runtime-seeds.json', 'rootfs/node-apk-lock.json', 'rootfs/android-compat.c', 'rootfs/termux-lock.json', 'node-host/package-lock.json') }}
          restore-keys: m1-kernel-v2-${{ runner.os }}-${{ matrix.abi }}-
      - name: Build and smoke-test musl PTY and image processing
        if: steps.runtime.outputs.cache-hit != 'true'
        run: |
          if test -f app/src/main/assets/kernel/${{ matrix.abi }}.txz; then
            npm --prefix node-host ci --ignore-scripts --no-audit --no-fund
            python3 rootfs/prepare.py --extend-host --abi ${{ matrix.abi }}
          else
            python3 rootfs/prepare.py --rootfs-only --abi ${{ matrix.abi }}
          fi
      - uses: actions/cache/save@v4
        if: steps.runtime.outputs.cache-hit != 'true'
        with:
          path: |
            app/src/main/assets/kernel/${{ matrix.abi }}.txz
            .research/runtime/${{ matrix.abi }}.tgz
            docs/m1-size-${{ matrix.abi }}.json
          key: ${{ steps.runtime.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: m2-runtime-${{ matrix.abi }}
          include-hidden-files: true
          path: |
            app/src/main/assets/kernel/${{ matrix.abi }}.txz
            .research/runtime/${{ matrix.abi }}.tgz
            docs/m1-size-${{ matrix.abi }}.json
  development:
    needs: [host, runtime, proot-source]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: docker/setup-qemu-action@v3
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v4
        with: { name: m2-host, path: node-host/dist }
      - uses: actions/download-artifact@v4
        with: { pattern: m2-runtime-*, path: ., merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { name: m2-android-proot, path: app/src/main }
      - name: Refresh our host and plugins for both ABIs
        run: python3 rootfs/prepare.py --refresh-host
      - name: Import every plugin from the packaged runtimes
        run: python3 rootfs/verify-packed.py
      - name: Restore the original update-compatible signing key
        env:
          HOSHINO_KEYSTORE: ${{ secrets.HOSHINO_DEBUG_KEYSTORE }}
        run: |
          test -n "$HOSHINO_KEYSTORE"
          mkdir -p ~/.android
          printf '%s' "$HOSHINO_KEYSTORE" | base64 --decode > ~/.android/debug.keystore
          chmod 600 ~/.android/debug.keystore
      - name: Bundle the editable public Harness source
        run: python3 tools/package-source.py
      - name: Build development APKs and unit tests
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug test :app:assembleX86DebugAndroidTest -Pkotlin.compiler.execution.strategy=in-process --console=plain
          python3 tools/package-m2.py
          for apk in build/deliverables/*0.2.0-m2*.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | tee /tmp/apk-cert.txt
            grep -qi 'e20b0b97868f158e8570f712b4d488b4f7671ecfc7f5ad72cd66b04a8a5e8fd1' /tmp/apk-cert.txt
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hoshino-m2-development
          path: |
            build/deliverables/*0.2.0-m2*
            docs/m2-apk-sizes.json
            docs/m1-size-*.json
            core-bridge/build/reports/tests
            app/build/outputs/apk/androidTest/x86/debug/*.apk
  native-smoke:
    needs: development
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: actions/download-artifact@v4
        with: { name: hoshino-m2-development, path: artifacts }
      - name: Start local mock model
        run: node tools/mock-llm/server.mjs > mock.log 2>&1 &
      - name: Fetch pinned official Shizuku manager for installation detection
        run: python3 tools/prepare-shizuku-fixture.py
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          if test -e /dev/kvm; then sudo chmod a+rw /dev/kvm; fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 3072
          script: |
            mkdir -p reports
            adb reverse tcp:8099 tcp:8099
            adb install --no-streaming -r .research/shizuku-manager/manager.apk
            adb install --no-streaming -r artifacts/build/deliverables/Hoshino-Harness-0.2.0-m2-x86_64-debug.apk
            adb install --no-streaming -r artifacts/app/build/outputs/apk/androidTest/x86/debug/app-x86-debug-androidTest.apk
            adb shell pm grant dev.hoshino.app android.permission.POST_NOTIFICATIONS
            python3 tools/start-shizuku-fixture.py --serial emulator-5554
            adb shell am instrument -w -r -e class app.hoshino.harness.M1UiSmokeTest,app.hoshino.harness.M1ConversationSmokeTest,app.hoshino.harness.ShizukuDetectionTest,app.hoshino.harness.PermissionCapabilityTest,app.hoshino.harness.ShizukuExecutionTest,app.hoshino.harness.HistorySearchTest,app.hoshino.harness.UiCustomizationTest,app.hoshino.harness.ChatExperienceTest,app.hoshino.harness.M2AcceptanceTest dev.hoshino.app.test/androidx.test.runner.AndroidJUnitRunner | tee reports/m1-ui-smoke.txt
            adb shell run-as dev.hoshino.app cat files/m2-native-metrics.json > reports/m2-native-metrics.json
            adb logcat -b crash -d -v brief | sed -E 's/sk-[A-Za-z0-9_-]+/[redacted]/g;s/Bearer [A-Za-z0-9._=-]+/Bearer [redacted]/g' > reports/m1-crash.txt
            grep -q 'OK (10 tests)' reports/m1-ui-smoke.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m1-native-smoke
          path: |
            reports
            mock.log
  background-metrics:
    needs: development
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: hoshino-m2-development, path: artifacts }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 3072
          script: |
            adb install --no-streaming -r artifacts/build/deliverables/Hoshino-Harness-0.2.0-m2-x86_64-debug.apk
            adb shell pm grant dev.hoshino.app android.permission.POST_NOTIFICATIONS
            python3 tools/background-metrics.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: m2-background-metrics, path: reports }

  publish-preview:
    needs: [development, native-smoke]
    if: always() && needs.development.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: hoshino-m2-development, path: artifacts }
      - uses: actions/download-artifact@v4
        with: { name: m1-native-smoke, path: native-results }
      - name: Publish signed dual ABI implementation preview and honest evidence
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RESULT: ${{ needs.native-smoke.result }}
        run: |
          python3 - <<'PY'
          import json,pathlib,hashlib,zipfile
          records=json.loads(pathlib.Path('artifacts/docs/m2-apk-sizes.json').read_text())
          metrics=json.loads(pathlib.Path('m2-metrics.json').read_text())
          metrics.update(status='implementation-preview-not-full-M2-acceptance',sourceCommit='${{ github.sha }}',buildRun='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}',nativeVerification='${{ needs.native-smoke.result }}')
          metrics['apkBytes']={r['abi']:r['bytes'] for r in records}
          metrics['apkSha256']={r['abi']:r['sha256'] for r in records}
          for record in records:
            apk=pathlib.Path('artifacts/build/deliverables')/record['apk']
            assert apk.stat().st_size==record['bytes']
            assert hashlib.sha256(apk.read_bytes()).hexdigest()==record['sha256']
            with zipfile.ZipFile(apk) as z: assert {n.split('/')[1] for n in z.namelist() if n.startswith('lib/')}=={record['abi']}
          pathlib.Path('m2-metrics.json').write_text(json.dumps(metrics,ensure_ascii=False,indent=2)+'\n')
          PY
          cat > release-notes.md <<'NOTES'
          0.2.0-m2 implementation preview. Same application ID dev.hoshino.app, versionCode 200, original signing certificate e20b0b97868f158e8570f712b4d488b4f7671ecfc7f5ad72cd66b04a8a5e8fd1.

          Main Android phones: download arm64-v8a. x86_64 is for compatible devices/emulators. Keep the installed app and use overwrite installation; do not uninstall to update.

          This is not full acceptance of Hoshino_Harness_M2.md. The attached m2-report.md lists implemented functions and explicit remaining gaps. No OEM/arm64 physical phone was connected. No fabricated performance data; unavailable measurements are null.

          Source: ${{ github.sha }}
          Build and signature gate: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Native regression result: ${{ needs.native-smoke.result }}. Raw native reports are attached as m2-native-reports.zip.
          NOTES
          zip -qr m2-native-reports.zip native-results
          gh release create v0.2.0-m2 --target '${{ github.sha }}' --title 'Hoshino Harness 0.2.0-m2 · 实现预览' --prerelease --notes-file release-notes.md artifacts/build/deliverables/* docs/m2-report.md docs/m2-decisions.md docs/m2-plugin-compat.md docs/m2-device-checklist.md docs/m2-slim.md docs/m2-security-review.md artifacts/docs/m2-apk-sizes.json m2-metrics.json m2-native-reports.zip README.md
