name: M0 Android acceptance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  proot-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile upstream proot in the actual Android ABI
        run: python3 rootfs/build-proot.py
      - uses: actions/upload-artifact@v4
        with:
          name: android-proot
          path: |
            app/src/main/jniLibs
            app/src/main/assets/licenses
  guest-compat:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile Linux guest compatibility library
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools
          musl-gcc -shared -fPIC -O2 -Wall -Wextra -Werror -o libandroid-compat.so rootfs/android-compat.c
      - uses: actions/upload-artifact@v4
        with:
          name: guest-compat-x86_64
          path: libandroid-compat.so
  m0:
    needs: proot-source
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: node-host/package-lock.json }
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: docker/setup-qemu-action@v3
      - name: Install and test original dsh
        working-directory: node-host
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm test
      - name: Optional real model tests (skip when secrets absent)
        working-directory: node-host
        env:
          M0_REAL_TESTS: '1'
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: node --test test/real-provider.test.mjs
      - uses: actions/cache/restore@v4
        id: kernel-cache
        with:
          path: |
            app/src/main/assets/kernel
            app/src/main/assets/licenses
            app/src/main/jniLibs
            .research/runtime/*.tgz
            docs/m0-size-*.json
          key: kernel-v5-${{ runner.os }}-${{ hashFiles('rootfs/Dockerfile', 'rootfs/pack.py', 'rootfs/runtime-seeds.json', 'rootfs/node-apk-lock.json', 'rootfs/android-compat.c', 'rootfs/termux-lock.json', 'node-host/package-lock.json') }}
      - name: Prepare embedded runtimes for both ABIs
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: python3 rootfs/prepare.py --rootfs-only
      - uses: actions/download-artifact@v4
        with: { name: android-proot, path: 'app/src/main' }
      - uses: actions/cache/save@v4
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        with:
          path: |
            app/src/main/assets/kernel
            app/src/main/assets/licenses
            app/src/main/jniLibs
            .research/runtime/*.tgz
            docs/m0-size-*.json
          key: ${{ steps.kernel-cache.outputs.cache-primary-key }}
      - name: Refresh compiled host and plugins in cached runtimes
        if: steps.kernel-cache.outputs.cache-hit == 'true'
        run: python3 rootfs/prepare.py --refresh-host
      - name: Build APK and unit tests
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug test :app:assembleX86DebugAndroidTest :benchmark-driver:assembleDebugAndroidTest -Pkotlin.compiler.execution.strategy=in-process --console=plain
          python3 tools/check-apks.py
          ./gradlew --stop
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android instrumentation (all eight standards)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096 -partition-size 2047
          script: |
            node tools/mock-llm/server.mjs > /tmp/mock.log 2>&1 &
            adb reverse tcp:8099 tcp:8099
            ./gradlew :app:connectedX86DebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true --console=plain
            adb shell cat /sdcard/Android/data/dev.hoshino.app/files/m0-metrics.json > docs/m0-acceptance-metrics.json
            adb shell cat /sdcard/Android/data/dev.hoshino.app/files/m0-memory.txt > docs/m0-memory.txt
            ./gradlew :benchmark-driver:connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true --console=plain
            adb shell cat /sdcard/Android/data/dev.hoshino.benchmark/files/m0-metrics.json > docs/m0-metrics.json
            mkdir -p docs/m0-memory
            find docs/m0-memory -maxdepth 1 -type f -name '*.txt' -delete
            adb pull /sdcard/Android/data/dev.hoshino.benchmark/files/m0-memory/. docs/m0-memory
            python3 tools/verify-metrics.py
      - name: Upload APK and verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hoshino-m0
          path: |
            app/build/outputs/apk/arm64/debug/*.apk
            app/build/outputs/apk/x86/debug/*.apk
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            benchmark-driver/build/reports/androidTests
            benchmark-driver/build/outputs/androidTest-results
            core-bridge/build/reports/tests
            docs/m0-metrics.json
            docs/m0-acceptance-metrics.json
            docs/m0-memory.txt
            docs/m0-memory
            docs/m0-size-*.json
            docs/m0-apk-sizes.json
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: m0
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: hoshino-m0, path: artifact }
      - env: { GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}' }
        run: gh release create "${GITHUB_REF_NAME}" artifact/app/build/outputs/apk/arm64/debug/*.apk artifact/app/build/outputs/apk/x86/debug/*.apk --generate-notes
