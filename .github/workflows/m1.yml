name: M1 development build
on:
  push:
    branches: [codex/m1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: node-host/package-lock.json }
      - name: Compile and test the original dsh composition
        working-directory: node-host
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm test
      - uses: actions/upload-artifact@v4
        with: { name: m1-host, path: node-host/dist }
  proot-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 rootfs/build-proot.py
      - uses: actions/upload-artifact@v4
        with:
          name: m1-android-proot
          path: |
            app/src/main/jniLibs
            app/src/main/assets/licenses
  runtime:
    needs: host
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: actions/download-artifact@v4
        with: { name: m1-host, path: node-host/dist }
      - uses: actions/cache/restore@v4
        id: runtime
        with:
          path: |
            app/src/main/assets/kernel/${{ matrix.abi }}.txz
            .research/runtime/${{ matrix.abi }}.tgz
            docs/m1-size-${{ matrix.abi }}.json
          key: m1-kernel-v2-${{ runner.os }}-${{ matrix.abi }}-${{ hashFiles('rootfs/Dockerfile', 'rootfs/pack.py', 'rootfs/runtime-seeds.json', 'rootfs/node-apk-lock.json', 'rootfs/android-compat.c', 'rootfs/termux-lock.json', 'node-host/package-lock.json') }}
      - name: Build and smoke-test musl PTY and image processing
        if: steps.runtime.outputs.cache-hit != 'true'
        run: python3 rootfs/prepare.py --rootfs-only --abi ${{ matrix.abi }}
      - uses: actions/cache/save@v4
        if: steps.runtime.outputs.cache-hit != 'true'
        with:
          path: |
            app/src/main/assets/kernel/${{ matrix.abi }}.txz
            .research/runtime/${{ matrix.abi }}.tgz
            docs/m1-size-${{ matrix.abi }}.json
          key: ${{ steps.runtime.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: m1-runtime-${{ matrix.abi }}
          include-hidden-files: true
          path: |
            app/src/main/assets/kernel/${{ matrix.abi }}.txz
            .research/runtime/${{ matrix.abi }}.tgz
            docs/m1-size-${{ matrix.abi }}.json
  development:
    needs: [host, runtime, proot-source]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: docker/setup-qemu-action@v3
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v4
        with: { name: m1-host, path: node-host/dist }
      - uses: actions/download-artifact@v4
        with: { pattern: m1-runtime-*, path: ., merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { name: m1-android-proot, path: app/src/main }
      - name: Refresh our host and plugins for both ABIs
        run: python3 rootfs/prepare.py --refresh-host
      - name: Import every plugin from the packaged runtimes
        run: python3 rootfs/verify-packed.py
      - name: Build development APKs and unit tests
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug test :app:assembleX86DebugAndroidTest -Pkotlin.compiler.execution.strategy=in-process --console=plain
          python3 tools/package-m1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hoshino-m1-development
          path: |
            build/deliverables/*0.1.0-m1*
            docs/m1-apk-sizes.json
            docs/m1-size-*.json
            core-bridge/build/reports/tests
            app/build/outputs/apk/androidTest/x86/debug/*.apk
  native-smoke:
    needs: development
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: actions/download-artifact@v4
        with: { name: hoshino-m1-development, path: artifacts }
      - name: Start local mock model
        run: node tools/mock-llm/server.mjs > mock.log 2>&1 &
      - name: Fetch pinned official Shizuku manager for installation detection
        run: python3 tools/prepare-shizuku-fixture.py
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -memory 2048
          script: |
            mkdir -p reports
            adb reverse tcp:8099 tcp:8099
            adb install -r .research/shizuku-manager/manager.apk
            adb install -r artifacts/build/deliverables/Hoshino-Harness-0.1.0-m1-x86_64-debug.apk
            adb install -r artifacts/app/build/outputs/apk/androidTest/x86/debug/app-x86-debug-androidTest.apk
            adb shell pm grant dev.hoshino.app android.permission.POST_NOTIFICATIONS
            adb shell am instrument -w -r -e class app.hoshino.harness.M1UiSmokeTest,app.hoshino.harness.M1ConversationSmokeTest,app.hoshino.harness.ShizukuDetectionTest dev.hoshino.app.test/androidx.test.runner.AndroidJUnitRunner | tee reports/m1-ui-smoke.txt
            grep -q 'OK (3 tests)' reports/m1-ui-smoke.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m1-native-smoke
          path: |
            reports
            mock.log
