name: DSH upgrade three checks
on:
  push:
    branches: [codex/dsh-upgrade]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: node-host/package-lock.json }
      - name: Build the original dsh composition and shell adapters
        working-directory: node-host
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          python3 ../tools/check-dsh-staged-create.py
      - uses: actions/upload-artifact@v4
        with: { name: dsh-upgrade-host, path: node-host/dist }
  proot-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 rootfs/build-proot.py
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-upgrade-proot
          path: |
            app/src/main/jniLibs
            app/src/main/assets/licenses
  runtime:
    needs: host
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Reuse the verified original alpha.2 runtime; rebuild only our adapter later
        uses: actions/download-artifact@v4
        with:
          name: dsh-upgrade-runtime-${{ matrix.abi }}
          run-id: 40687337006
          github-token: ${{ github.token }}
          path: .
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-upgrade-runtime-${{ matrix.abi }}
          include-hidden-files: true
          path: |
            app/src/main/assets/kernel/${{ matrix.abi }}.txz
            .research/runtime/${{ matrix.abi }}.tgz
            docs/m1-size-${{ matrix.abi }}.json
  development:
    needs: [host, runtime, proot-source]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: docker/setup-qemu-action@v3
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v4
        with: { name: dsh-upgrade-host, path: node-host/dist }
      - uses: actions/download-artifact@v4
        with: { pattern: dsh-upgrade-runtime-*, path: ., merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { name: dsh-upgrade-proot, path: app/src/main }
      - name: Refresh our host and plugins for both ABIs
        run: python3 rootfs/prepare.py --refresh-host
      - name: Import every plugin from the packaged runtimes
        run: python3 rootfs/verify-packed.py
      - name: Restore the original update-compatible signing key
        env:
          HOSHINO_KEYSTORE: ${{ secrets.HOSHINO_DEBUG_KEYSTORE }}
        run: |
          test -n "$HOSHINO_KEYSTORE"
          mkdir -p ~/.android
          printf '%s' "$HOSHINO_KEYSTORE" | base64 --decode > ~/.android/debug.keystore
          chmod 600 ~/.android/debug.keystore
      - name: Bundle the editable public Harness source
        run: python3 tools/package-source.py
      - uses: gradle/actions/setup-gradle@v4
      - name: Case 1 signed dual ABI build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug :app:assembleX86DebugAndroidTest -Pkotlin.compiler.execution.strategy=in-process --console=plain
          python3 tools/package-dsh-upgrade.py
          for apk in build/deliverables/*0.2.1-m2.1*.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | tee /tmp/apk-cert.txt
            grep -qi 'e20b0b97868f158e8570f712b4d488b4f7671ecfc7f5ad72cd66b04a8a5e8fd1' /tmp/apk-cert.txt
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hoshino-dsh-upgrade
          path: |
            build/deliverables/*0.2.1-m2.1*
            docs/dsh-upgrade-apk-sizes.json
            docs/m1-size-*.json
            app/build/outputs/apk/androidTest/x86/debug/*.apk
  arm64-boot:
    needs: development
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: hoshino-dsh-upgrade, path: artifacts }
      - name: Real arm64 kernel boots with Anthropic, OpenAI-compatible and ChatGPT providers configured
        working-directory: tools/diag
        env:
          PROVIDERS: '[{"id":"claude","type":"anthropic","baseURL":"https://api.anthropic.com","apiKey":"KEY_CLAUDE","models":["claude-sonnet-4-5"]},{"id":"deepseek","type":"openai-compatible","baseURL":"https://api.deepseek.com/v1","apiKey":"KEY_DS","models":["deepseek-chat"]},{"id":"openai-codex","type":"openai-codex","baseURL":"https://chatgpt.com/backend-api","apiKey":"KEY_OPENAI_CODEX","models":["gpt-5.1-codex"]}]'
        run: |
          mkdir -p ../../boot
          bash boot.sh ../../artifacts/build/deliverables/Hoshino-Harness-0.2.1-m2.1-arm64-v8a-debug.apk arm64-v8a ../../boot/arm64-anthropic-boot.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: arm64-boot, path: boot }
  acceptance:
    needs: development
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: actions/download-artifact@v4
        with: { name: hoshino-dsh-upgrade, path: artifacts }
      - name: Previous signed APK for overwrite verification
        run: |
          curl --fail --location --retry 3 'https://github.com/senseixiaomisensei-sudo/hoshino-harness-android/releases/download/v0.2.0-m2/Hoshino-Harness-0.2.0-m2-x86_64-debug.apk' -o old-m2.apk
          echo '8654d5c001fd8d69ec0dd53752b184169a8dd6b172b15eb6c4afea2eae4edec8  old-m2.apk' | sha256sum --check
      - run: node tools/mock-llm/m21.mjs > mock.log 2>&1 &
      - name: Emulator acceleration
        run: |
          if test -e /dev/kvm; then sudo chmod a+rw /dev/kvm; fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 3072
          script: python3 tools/dsh-upgrade-acceptance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsh-upgrade-acceptance
          path: |
            reports
            mock.log
  publish:
    needs: [development, acceptance, arm64-boot]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: hoshino-dsh-upgrade, path: artifacts }
      - uses: actions/download-artifact@v4
        with: { name: dsh-upgrade-acceptance, path: acceptance }
      - uses: actions/download-artifact@v4
        with: { name: arm64-boot, path: boot }
      - name: Publish after the three requested checks pass
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          test "$(gh api repos/${{ github.repository }}/git/ref/heads/codex/dsh-upgrade --jq .object.sha)" = "${{ github.sha }}"
          python3 tools/dsh-upgrade-release.py
          gh release create v0.2.1-m2.1 --target '${{ github.sha }}' --prerelease --title 'Hoshino 0.2.1-m2.1 · 修复内核连接' --notes-file build/dsh-upgrade-release.md artifacts/build/deliverables/* artifacts/docs/dsh-upgrade-apk-sizes.json acceptance/reports/dsh-upgrade-acceptance.json
